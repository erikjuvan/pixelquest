# Pixel Quest power button and power-cut GPIOs.
#
# BCM 27 (physical pin 13): active-low shutdown request from the second pole
# of the external power button.
# BCM 10 (physical pin 19): active-high signal to the Pololu OFF input.
dtoverlay=gpio-shutdown,gpio_pin=27,active_low=1,gpio_pull=up,debounce=50
dtoverlay=gpio-poweroff,gpiopin=10
